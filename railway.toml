# Monorepo worker services (integration-refresh, housekeeping): build only.
# Set each service Start Command via RAILPACK_CONFIG_FILE + railpack.*.json (no startCommand here).
# See orchestrator/README.md and web/src/content/docs/installation/railway.md

[build]
buildCommand = "export NODE_OPTIONS=--max-old-space-size=8192 && pnpm install --prod=false && pnpm railway:orchestrator:build"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
multiRegionConfig = { us-west2 = { numReplicas = 1 } }
limitOverride = { containers = { cpu = 1, memoryBytes = 1073741824 } }
