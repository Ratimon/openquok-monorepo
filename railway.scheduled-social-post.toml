# Scheduled social post worker — same build as railway.toml; point this service’s Config File here for 2 GiB limits in the dashboard if needed.
# Build must produce orchestrator/dist before start.

[build]
buildCommand = "export NODE_OPTIONS=--max-old-space-size=8192 && pnpm install --prod=false && pnpm railway:orchestrator:build"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
multiRegionConfig = { us-west2 = { numReplicas = 1 } }
limitOverride = { containers = { cpu = 1, memoryBytes = 2147483648 } }
